workflows:
  android-release:
    name: Dizzy.tv Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Flutter versiyasini tekshirish
        script: flutter --version

      - name: Gradle va Flutter keshini tozalash
        script: |
          flutter clean
          cd android && ./gradlew clean || true && cd ..

      - name: Paketlarni yuklash
        script: flutter pub get

      - name: SHA KALITLARNI KO'RISH (Firebase uchun)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew signingReport 2>&1 | grep -A 5 "Variant: release\|SHA1\|SHA-256\|Keystore"
          cd ..

      - name: Kodni tahlil qilish
        script: flutter analyze --no-fatal-infos
        ignore_failure: true

      - name: APK build qilish
        script: |
          flutter build apk \
            --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - reyimberganovixlosbek11@gmail.com
        notify:
          success: true
          failure: true
