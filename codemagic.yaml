workflows:
  android-release:
    name: Dizzy.tv Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Flutter versiyasini tekshirish
        script: flutter --version

      - name: Gradle va Flutter keshini tozalash
        script: |
          flutter clean
          flutter pub get

      - name: Paketlarni yuklash
        script: flutter pub get

      - name: Kodni tahlil qilish
        script: flutter analyze --no-fatal-infos
        ignore_failure: true

      - name: APK build qilish
        script: |
          flutter build apk \
            --release \
            --target-platform android-arm,android-arm64,android-x64 \
            --split-per-abi

      - name: SHA KALITLARNI KO'RISH (Firebase uchun)
        script: |
          echo "=== APK SHA KALITLARI ==="
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "APK: $apk"
            apksigner verify --print-certs "$apk" | grep -E "SHA-1|SHA-256"
            echo "---"
          done

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/apk/release/*.apk

    publishing:
      email:
        recipients:
          - reyimberganovixlosbek11@gmail.com
        notify:
          success: true
          failure: true
